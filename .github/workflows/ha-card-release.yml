name: Release HA Card

on:
  push:
    tags:
      - "ha-card-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. ha-card-v0.1.0)"
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: ha-card
        run: npm ci || npm install

      - name: Build
        working-directory: ha-card
        run: npm run build

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: ha-card/dist/edumanage-card.js
          generate_release_notes: true
