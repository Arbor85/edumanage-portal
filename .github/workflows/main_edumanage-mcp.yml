name: Build and deploy MCP server to Azure Web App - edumanage-mcp

on:
  push:
    branches:
      - main
    paths:
      - 'netbackend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore netbackend/EduManage.NetBackend.sln

      - name: Build
        run: dotnet build netbackend/src/EduManage.Mcp/EduManage.Mcp.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish netbackend/src/EduManage.Mcp/EduManage.Mcp.csproj --configuration Release --output ./publish-mcp --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-mcp
          path: ./publish-mcp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-mcp
          path: ./publish-mcp

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'edumanage-mcp'
          slot-name: 'Production'
          package: ./publish-mcp

      - name: Restart Azure Web App
        run: az webapp restart --name edumanage-mcp --resource-group edumanage-rg

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 3
    steps:
      - name: Wait for app to respond
        run: |
          echo "Waiting for MCP server to start..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://edumanage-mcp.azurewebsites.net/mcp)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then
              echo "MCP server is up!"
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed after 3 minutes"
          exit 1
