services:
  backend:
    build:
      context: ./netbackend
      dockerfile: Dockerfile
    container_name: edumanage-backend
    ports:
      - "5090:5090"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/edumanage.db
      - Authentication__Auth0__Domain=${AUTH0_DOMAIN}
      - Authentication__Auth0__Audience=${AUTH0_AUDIENCE}
      # Allow direct API access from host during development (nginx proxy handles prod)
      - AllowedOrigins__0=http://localhost:80
      - AllowedOrigins__1=http://localhost
    volumes:
      - db_data:/data

  frontend:
    build:
      context: ./modern
      dockerfile: Dockerfile
      args:
        # VITE_API_BASE_URL is intentionally empty — nginx proxies /api to backend
        VITE_API_BASE_URL: ""
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    container_name: edumanage-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
