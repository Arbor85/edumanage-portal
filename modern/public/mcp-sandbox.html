<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>MCP-UI Proxy</title>
    <style>
      html, body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        background-color: transparent;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      * { box-sizing: border-box; }
      iframe {
        background-color: transparent;
        border: none;
        padding: 0;
        overflow: hidden;
        flex-grow: 1;
        color-scheme: inherit;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Security: must only run inside an iframe
      if (window.self === window.top) {
        throw new Error('mcp-sandbox.html must only be loaded in an iframe.');
      }

      const RESOURCE_READY = 'ui/notifications/sandbox-resource-ready';
      const PROXY_READY    = 'ui/notifications/sandbox-proxy-ready';

      // Double-iframe architecture: this outer proxy creates an inner iframe
      // for the actual MCP app HTML so untrusted content is further sandboxed.
      const inner = document.createElement('iframe');
      inner.style.cssText = 'width:100%;height:100%;border:none;';
      inner.setAttribute('sandbox', 'allow-scripts allow-forms');
      document.body.appendChild(inner);

      window.addEventListener('message', (event) => {
        if (event.source === window.parent) {
          if (event.data && event.data.method === RESOURCE_READY) {
            const { html, sandbox } = event.data.params || {};
            if (typeof sandbox === 'string') {
              inner.setAttribute('sandbox', sandbox);
            }
            if (typeof html === 'string') {
              const doc = inner.contentDocument || inner.contentWindow?.document;
              if (doc) {
                doc.open();
                doc.write(html);
                doc.close();
              } else {
                inner.srcdoc = html;
              }
            }
          } else {
            inner.contentWindow?.postMessage(event.data, '*');
          }
        } else if (event.source === inner.contentWindow) {
          window.parent.postMessage(event.data, '*');
        }
      });

      // Notify parent that sandbox proxy is ready
      window.parent.postMessage(
        { jsonrpc: '2.0', method: PROXY_READY, params: {} },
        '*'
      );
    </script>
  </body>
</html>
